
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUARA2WORD PRO</title>
<style>
body{margin:0;background:#090b10;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:25px}
main{max-width:650px;margin:auto;background:#171923;padding:25px;border:1px solid #b89448;border-radius:18px}
h1{color:#ffe4a1}
button{padding:13px;margin:6px;border:1px solid #e8bd63;border-radius:10px;background:#292114;color:#ffe4a1;font-weight:bold;cursor:pointer}
.primary{background:#e8bd63;color:#17120a}
input{padding:12px;width:90%;max-width:420px;border-radius:8px;border:1px solid #555;background:#090b10;color:white}
#timer{font-size:42px;color:#ffe4a1;margin:25px}
#status{padding:12px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>🎙️ SUARA2WORD PRO</h1>
<p>SMK APIN-APIN KENINGAU</p>
<p>RAKAMAN SUARA · BLACK GOLD PREMIUM</p>
<input id="title" placeholder="Tajuk rakaman">
<div id="timer">00:00:00</div>
<button class="primary" id="start">● MULA RAKAM</button>
<button id="pause" disabled>Ⅱ JEDA</button>
<button id="stop" disabled>■ HENTI</button>
<p id="status">Sedia untuk merakam.</p>
<audio id="player" controls hidden></audio>
<br>
<button id="download" disabled>⬇ MUAT TURUN AUDIO</button>
</main>
<script>
let recorder, chunks=[], blob, stream, elapsed=0, started=0, ticker, pausedAt=0;

const $=id=>document.getElementById(id);
function showTime(s){
  s=Math.max(0,s);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
  $('timer').textContent=[h,m,sec].map(n=>String(n).padStart(2,'0')).join(':');
}
function tick(){
  elapsed=Math.floor((Date.now()-started)/1000);
  showTime(elapsed);
}
$('start').onclick=async()=>{
  try{
    if(!navigator.mediaDevices?.getUserMedia)
      throw Error('Pelayar tidak menyediakan akses mikrofon. Pastikan halaman dibuka melalui HTTPS.');
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    const type=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ?'audio/webm;codecs=opus':'';
    recorder=new MediaRecorder(stream,type?{mimeType:type}:{});
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstop=()=>{
      blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
      $('player').src=URL.createObjectURL(blob);
      $('player').hidden=false;
      $('download').disabled=false;
      stream?.getTracks().forEach(t=>t.stop());
      $('status').textContent='Rakaman siap. Tekan Muat Turun Audio untuk menyimpan.';
    };
    recorder.start();
    started=Date.now()-elapsed*1000;
    ticker=setInterval(tick,500);
    $('start').disabled=true;$('pause').disabled=false;$('stop').disabled=false;
    $('status').textContent='Sedang merakam. Pastikan mikrofon berfungsi.';
  }catch(e){
    $('status').textContent='Ralat mikrofon: '+e.message;
  }
};
$('pause').onclick=()=>{
  if(!recorder)return;
  if(recorder.state==='recording'){
    recorder.pause();clearInterval(ticker);
    $('pause').textContent='▶ SAMBUNG';
    $('status').textContent='Rakaman dijeda.';
  }else if(recorder.state==='paused'){
    recorder.resume();started=Date.now()-elapsed*1000;
    ticker=setInterval(tick,500);
    $('pause').textContent='Ⅱ JEDA';
    $('status').textContent='Rakaman disambung.';
  }
};
$('stop').onclick=()=>{
  if(recorder&&recorder.state!=='inactive')recorder.stop();
  clearInterval(ticker);
  $('start').disabled=false;$('pause').disabled=true;$('stop').disabled=true;
  $('pause').textContent='Ⅱ JEDA';
};
$('download').onclick=()=>{
  if(!blob)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(($('title').value||'Rakaman').replace(/[^\w -]/g,'')||'Rakaman')+'.webm';
  a.click();URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
